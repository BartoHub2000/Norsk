<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Norsk</title>
<meta name="theme-color" content="#14232c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Norsk">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: phone app shell — sticky header (streak + goal ring), scrolling content, bottom tab bar. Fjord slate + safety orange. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --sunk:#e1e8ec; --fg:#14232c; --muted:#5b6d78; --line:#d3dce2;
  --accent:#e8590c; --accent-fg:#ffffff; --fjord:#1f5f7a; --rc:#7a4cc9; --good:#2f8a4e; --warn:#c07a00; --bad:#c2392b; --star:#f2a900;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
  --fm:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0c161c; --surface:#14222a; --sunk:#1b2d37; --fg:#e6eef2; --muted:#93a7b3; --line:#263b47;
  --accent:#ff7a33; --accent-fg:#1a0d05; --fjord:#6fb3d1; --rc:#b597f2; --good:#5cc37f; --warn:#e2a93b; --bad:#ec6a5c; --star:#ffc233; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;min-height:44px;font-weight:500;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:650}
button.ghost{background:transparent;border-color:transparent}
button.chip{min-height:36px;padding:6px 12px;border-radius:999px;font-size:.9rem}
button.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:disabled{opacity:.45;cursor:default}
h1,h2,h3{font-family:var(--fd);margin:0;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:1.6rem;font-weight:800} h2{font-size:1.2rem;font-weight:750} h3{font-size:1rem;font-weight:700}
.eyebrow{font-family:var(--fm);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.86rem}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--bg)}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.brand{font-family:var(--fd);font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.hstats{display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 6px;min-height:40px}
.streak{display:flex;align-items:center;gap:3px;font-weight:750;font-variant-numeric:tabular-nums}
.streak svg{width:20px;height:20px}
.streak.off{color:var(--muted)} .streak.off svg path{fill:var(--muted)}
.ring{width:34px;height:34px}
.ringtxt{font-family:var(--fm);font-size:.6rem;line-height:1.12;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;text-align:left}
.ringtxt .l1{color:var(--accent)} .ringtxt .l2{color:var(--fjord)} .ringtxt .l3{color:var(--rc)} .ringtxt .okk{color:var(--good)}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{border:none;background:transparent;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 10px;font-size:.75rem;color:var(--muted);min-height:58px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:650}
nav.tabs .badge{position:absolute;margin-left:22px;margin-top:-2px;background:var(--accent);color:var(--accent-fg);font-size:.65rem;font-weight:700;border-radius:999px;padding:1px 6px}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.hero{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero b.big{font-family:var(--fd);font-size:1.8rem;font-variant-numeric:tabular-nums;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;text-align:left;min-height:0}
.tile b{font-family:var(--fd);font-size:1.35rem;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:3px}
.pct{font-family:var(--fm);font-variant-numeric:tabular-nums;font-size:.85rem}
/* groups */
.glist{display:flex;flex-direction:column;gap:8px}
.gcard{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:14px}
.gcard .num{font-family:var(--fd);font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums;line-height:1.1}
.gcard .num small{display:block;font-family:var(--fm);font-weight:500;font-size:.68rem;color:var(--muted)}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:6px}
.cells i{height:8px;border-radius:2px;background:var(--sunk)}
.cells i.l1{background:color-mix(in srgb,var(--good) 25%,var(--sunk))} .cells i.l2{background:color-mix(in srgb,var(--good) 50%,var(--sunk))}
.cells i.l3{background:color-mix(in srgb,var(--good) 75%,var(--sunk))} .cells i.l4{background:var(--good)}
.cells i.st{outline:1.5px solid var(--accent);outline-offset:-1.5px}
.ucard{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;text-align:left;padding:12px 14px;border-radius:14px}
.chipst{font-size:.72rem;font-weight:650;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chipst.learn{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.chipst.done{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.stars{color:var(--star);letter-spacing:1px;font-size:.9rem;white-space:nowrap}
.stars .off{color:var(--sunk)}
/* segmented */
.seg{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px}
.seg button{flex:1;border:none;background:transparent;min-height:38px;padding:6px;font-size:.92rem}
.seg button[aria-selected="true"]{background:var(--surface);font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* sentence list */
.slist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.sitem{border-bottom:1px solid var(--line)} .sitem:last-child{border-bottom:none}
.sitem.on{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.shead{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px 12px 6px;text-align:left;border:none;border-radius:0;background:transparent;width:100%;min-height:0;font-weight:400}
.shead .n{font-family:var(--fm);font-size:.72rem;color:var(--muted);padding-top:4px;font-variant-numeric:tabular-nums}
.shead .no{font-size:1.05rem;font-weight:550}
.shead .pl{color:var(--muted);font-size:.9rem;margin-top:2px}
.sfoot{display:flex;gap:6px;align-items:center;padding:0 12px 10px 52px;flex-wrap:wrap}
.sfoot .vb{font-family:var(--fm);font-size:.74rem;color:var(--fjord);margin-right:auto}
.mini{min-height:32px;padding:4px 10px;font-size:.8rem;border-radius:999px}
.words{margin:0 12px 12px 52px;border-top:1px dashed var(--line);padding-top:8px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem}
.words .w{font-weight:650}
.words .b{font-family:var(--fm);font-size:.78rem;color:var(--fjord)}
.words .g{color:var(--fg)} .words .t{color:var(--muted);font-size:.8rem}
/* drill */
.drill{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;min-height:220px}
.drill .big{font-size:1.4rem;font-weight:550;line-height:1.35}
.drill .ans{font-size:1.35rem;font-weight:600;color:var(--fjord);line-height:1.35}
.reps{display:flex;gap:6px} .reps i{width:22px;height:6px;border-radius:3px;background:var(--sunk)} .reps i.on{background:var(--accent)}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rate button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;min-height:84px;text-align:center;position:relative}
.rate button .n{font-family:var(--fd);font-weight:800;font-size:1.35rem;line-height:1}.rate button .n i{font-style:normal;color:var(--star);font-size:.9rem;margin-left:1px}
.rate button.was{box-shadow:inset 0 0 0 2px var(--muted)}.rate button.was::after{content:'poprzednio';position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:.58rem;background:var(--muted);color:var(--bg);padding:1px 5px;border-radius:6px;white-space:nowrap}
.prevr{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.shead3{display:flex;align-items:center;gap:8px;margin-top:6px}
.rate button .d{font-size:.7rem;color:var(--muted);line-height:1.2}
.rate button .s{font-size:1.25rem;color:var(--star);line-height:1}
.rate button .k{font-size:.66rem;font-weight:600;line-height:1.15;color:var(--muted)}
.legend{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.8rem;color:var(--muted)}
.legend b{color:var(--star);font-weight:700}
.prog{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden} .prog i{display:block;height:100%;background:var(--accent)}
/* listen */
.now{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.now .no{font-size:1.25rem;font-weight:600}
.weights{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;align-items:end;height:64px}
.weights div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;color:var(--muted);height:100%;justify-content:flex-end}
.weights i{width:100%;background:var(--fjord);border-radius:4px 4px 0 0;opacity:.85}
.bigbtn{width:64px;height:64px;border-radius:50%;padding:0;display:grid;place-items:center}
.bigbtn svg{width:28px;height:28px}
/* stats */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;aspect-ratio:12/7;max-width:100%}
.heat i{border-radius:3px;background:var(--sunk)}
.heat i.h4{background:var(--accent)}
.heat i.h1{background:color-mix(in srgb,var(--accent) 18%,var(--sunk))} .heat i.h2{background:color-mix(in srgb,var(--accent) 45%,var(--sunk))} .heat i.h3{background:color-mix(in srgb,var(--accent) 72%,var(--sunk))}
.heat i.today{outline:2px solid var(--fg);outline-offset:-2px}
.dist{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunk)}
.dist i{display:block;height:100%}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.bp{display:block;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:2px}.bp i{display:block;height:100%;background:var(--accent)}
.bdg .ic svg{width:17px;height:17px}
.tile.hs{text-align:left;width:100%}
.hslist{display:flex;flex-direction:column;gap:4px;margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.hslist>span{display:grid;grid-template-columns:18px 1fr;column-gap:6px;font-size:.85rem;align-items:baseline}
.hslist i{font-style:normal;font-weight:800;color:var(--accent);grid-row:span 2}
.hslist em{font-style:normal;font-weight:700} .hslist small{color:var(--muted);font-size:.75rem}
.hslist .hnow em{color:var(--good)}
.hsmore{margin-top:2px}
.bar.tk{position:relative;overflow:visible}.bar.tk s{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--fg);opacity:.35}
.tiers{width:100%;border-collapse:collapse;font-size:.85rem}.tiers th{font-weight:600;color:var(--muted);font-size:.72rem;text-align:right;padding:4px}.tiers td{text-align:right;padding:6px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}.tiers td:first-child,.tiers th:first-child{text-align:left}.tiers tr.got td:first-child{color:var(--good);font-weight:700}
.seg button small{display:block;font-size:.62rem;font-weight:600;opacity:.65;letter-spacing:.04em;text-transform:uppercase}
.stepnext{display:flex;justify-content:flex-end}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile.preset{text-align:left;min-height:0;padding:10px}
.tile.preset b{font-size:1.15rem}
.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.gbar{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:.85rem}
.bdg{border:1px solid var(--line);border-radius:12px;padding:10px;font-size:.82rem;display:flex;gap:8px;align-items:center;background:var(--surface)}
.bdg .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-weight:800;font-size:.8rem;flex:none}
.bdg.got .ic{background:var(--accent);color:var(--accent-fg)} .bdg:not(.got) .ic{color:var(--muted)} .bdg:not(.got) b{color:var(--muted)}
.mnb{border:0;background:none;padding:0 2px;min-height:0;font-size:.75rem;color:var(--muted);text-decoration:underline dotted;cursor:pointer}
.mn,.mnh{display:block;margin-top:3px;padding:3px 8px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:0 6px 6px 0;font-size:.82rem;color:var(--fg)}
.mnh{margin:0 12px 10px 52px}
.mnlist{display:flex;flex-direction:column;gap:4px;font-size:.88rem;border-left:3px solid var(--accent);padding:4px 10px;background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:0 8px 8px 0}
.mnlist b{font-family:var(--fm);font-size:.8rem;color:var(--fjord);margin-right:4px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
.modal .sheet{width:100%;max-width:520px;background:var(--surface);border-radius:18px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal textarea{font-family:inherit;font-size:1rem;min-height:110px}
textarea{width:100%;font:inherit;font-size:.8rem;font-family:var(--fm);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:90px}
.back{padding-left:0;margin-left:-4px;align-self:flex-start}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:40;max-width:90vw;text-align:center}
.celebrate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);padding:24px}
.celebrate .box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;text-align:center;max-width:340px;display:flex;flex-direction:column;gap:10px}
.note{font-size:.84rem;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
@media (prefers-reduced-motion:no-preference){.sitem,.cells i{transition:background .2s}}
</style>
</head>
<body>
<header class="top"><div class="wrap hbar">
  <div class="brand">Norsk<span>.</span></div>
  <button class="hstats" data-a="stats" aria-label="Statystyki, seria i cele na dziś: minuty słuchania i powtórzenia">
    <span class="streak" id="hstreak"></span>
    <svg class="ring" viewBox="0 0 36 36" id="hring" aria-hidden="true"></svg>
    <span class="ringtxt" id="hxp"></span>
  </button>
</div></header>
<main class="wrap" id="app"></main>
<nav class="tabs"><div class="in">
  <button data-a="tab" data-t="learn" id="tb-learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 7h6"/></svg>Nauka</button>
  <button data-a="tab" data-t="test" id="tb-test"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 21v-5h-5"/></svg>Powtórki<span class="badge" id="tbadge" hidden></span></button>
  <button data-a="tab" data-t="listen" id="tb-listen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="2" y="14" width="5" height="7" rx="2"/><rect x="17" y="14" width="5" height="7" rx="2"/></svg>Słuchanie</button>
</div></nav>
<div class="toast" id="toast" hidden></div>
<div id="overlay"></div>
<audio id="fg" preload="auto" playsinline></audio>
<audio id="bg" preload="auto" playsinline></audio>
<script src="data.js"></script>
<script>
(()=>{
'use strict';
const {d:D,w:W,a:AF}=window.APPDATA; const N=D.length;
const NU=120, NG=12;
const uRange=u=>[u*10,u===NU-1?N:u*10+10];
const gUnits=g=>Array.from({length:10},(_,k)=>g*10+k);
const gRange=g=>[g*100,g===NG-1?N:g*100+100];
const unitOf=i=>Math.min(NU-1,Math.floor(i/10));
const AFILE={}; AF.forEach(x=>x.segs.forEach((s,k)=>AFILE[x.from-1+k]={f:x.f,s:s[0],e:s[1]}));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STAR='★';
const LABELS=['','Nie umiem','Coś pamiętam','Mam spore braki','Do doszlifowania','Znam doskonale'];
const SHORT=['','nie umiem','coś pamiętam','spore braki','do doszlifowania','doskonale'];

/* ---------- dates ---------- */
const dnum=(d=new Date())=>Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000);
const dkey=n=>{const d=new Date(n*86400000); return d.toISOString().slice(0,10);};
const today=()=>dnum();

/* ---------- state ---------- */
const KEY='norsk1200.v2';
const APPVER='7';
const DEF={v:2,s:{},u:{},day:{},best:0,set:{rate:1,reps:5,tr:true,lmin:20,lrep:1,lpool:'all',lspeed:1,lmode:'listen'},bdg:{},m:{}};
// skojarzenia z naszych rozmów, do edycji w aplikacji (klucz = forma podstawowa)
const SEED_M={'trenge':'trening: żeby coś umieć, potrzebujesz treningu','framme':'brama: jesteś na miejscu, kiedy stoisz pod bramą','glemme':'gleba + mmm: zakopałem coś w glebie i… mmm, zapomniałem gdzie',
 'ødelegge':'delegacja: przyjechała delegacja i wszystko zepsuła','lure på':'lura: zastanawiam się, czemu ta kawa to taka lura','bry seg':'brwi: unosisz brwi, bo ci zależy','lag':'lag w grze: cała drużyna gra z lagiem',
 'likevel':'licho wie: licho wie, co będzie, a i tak to zrobię','sti':'ścieżka: sti… ścieżka','savne':'sauna: tęsknię za sauną','velge':'Belgia / welon: wybierasz welon albo wycieczkę do Belgii','vanskelig':'wanna + skały: wanna pełna skał, trudna sprawa',
 'mellom':'melon: melon wciśnięty pomiędzy dwa inne','flytte':'flet: przy przeprowadzce pakujesz flet do pudła','venne seg':'Wenecja: w Wenecji szybko przyzwyczajasz się do łodzi','prate':'prać: gadamy przy praniu','flere':'flary: odpalasz kilka flar, coraz więcej',
 'lete':'lecieć: lecisz po całym domu, szukając kluczy (lete etter)','smerte':'śmierć / niem. Schmerz: ból jak śmierć','forsvinne':'forsa + świnie: forsa znika, bo świnie ją zjadły','bekymre seg':'beczy, że umrze: tak się martwi, że beczy',
 'stole':'stol = krzesło: ufasz krzesłu, że cię utrzyma (stole på)','svare':'swary: odpowiadasz i zaczynają się swary','løpe':'lipa / niem. laufen: biegniesz, bo lipa','trikk':'trick: jazda tramwajem bez biletu to niezły trick','ane':'Ania: Ania nie ma pojęcia (aner ikke)',
 'lyve':'lewe: kłamie, bo ma lewe papiery','kjempe':'szympans: walczy jak szympans','beskytte':'skyte (strzelać): chronisz kogoś, bo ktoś strzela','fjell':'fiołek: na górze rosną fiołki','ferge':'ferie: na ferie płyniesz promem',
 'bryte':'Brytania: Brytania zerwała z Unią','skape':'ang. shape / skapywać: tworzysz kształt, a farba skapuje','dårlig':'doły: kiepsko ci, jesteś w dołku','bestemme':'best: decydujesz, co jest najlepsze','passe på':'pasy: zapnij pasy, uważaj',
 'tjene':'cena: zarabiasz, żeby płacić ceny','gjelde':'jeleń: zasady dotyczą nawet jelenia','late som':'lata: od lat udaje','grunn':'grunt: z powodu (på grunn av) gruntu, podstawy','bare':'bare minimum: tylko tyle, ile trzeba',
 'ned':'Niderlandy: leżą nisko, w dole','huske':'huśtawka: pamiętasz huśtawkę z dzieciństwa','spise':'spiżarnia: jesz to, co ze spiżarni','gråte':'krata: płacze za kratami','selge':'Selgros: Selgros sprzedaje hurtowo','hete':'heca: heca, jak on się nazywa!','kjøpe':'szopa: kupujesz szopę'};
let S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){S=null;}
if(!S||S.v!==2) S=JSON.parse(JSON.stringify(DEF));
function normState(){S.set=Object.assign({},DEF.set,S.set||{}); S.bdg=S.bdg||{}; S.m=S.m||{}; S.s=S.s||{}; S.u=S.u||{}; S.day=S.day||{};
  if(!S.mSeed){for(const k in SEED_M) if(!S.m[k]) S.m[k]=SEED_M[k]; S.mSeed=1;}
  if(!S.v3){ // z punktów i 5 gwiazdek na dwa cele i 3 gwiazdki
    const og=S.goal||50; for(const k in S.day){const r=S.day[k]; if(r.xp!=null&&r.xp>=og) r.ok=1; if(r.rp==null) r.rp=r.t||0;}
    delete S.goal; S.v3=1; S.v7=1;}
  if(!S.v7){for(const k in S.s){const x=S.s[k]; if(x&&x.r) x.r=({1:2,2:3,3:5})[x.r]||x.r;} S.v7=1;}
  if(!S.v6){ // active recall osobno + jeden cel z progami Easy/Medium/Hard
    for(const k in S.day){const r=S.day[k]; if(r.rc==null){r.rc=r.t||0; r.rp=Math.max(0,(r.rp||0)-(r.t||0));} r.tier=r.ok?Math.max(1,r.tier||0):(r.tier||0);}
    delete S.gl; delete S.gr; delete S.newGoal; S.v6=1;}}
normState();
let saveT=null;
function save(){clearTimeout(saveT); saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Nie udało się zapisać postępu');}},250);}
window.addEventListener('pagehide',()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
const sst=i=>S.s[i]||null;
const stars=i=>(S.s[i]&&S.s[i].r)||0;
const started=u=>!!S.u[u];
const dayRec=(n=today())=>{const k=dkey(n); return S.day[k]||(S.day[k]={t:0,nw:0,ls:0,rp:0,rc:0});};
const TIERS=[{n:'Easy',ls:30*60,rp:100,rc:30,ng:10},{n:'Medium',ls:90*60,rp:300,rc:90,ng:30},{n:'Hard',ls:150*60,rp:500,rc:150,ng:50}];
// [pole, nazwa, format, jednostka, kolor, klasa]
const MET=[['ls','Słuchanie',v=>Math.floor(v/60),'min','var(--accent)','l1'],['rp','Powtórzenia',v=>Math.floor(v),'powt.','var(--fjord)','l2'],['rc','Active recall',v=>Math.floor(v),'recall','var(--rc)','l3']];
const tierOf=r=>{let t=0; for(const x of TIERS){if((r.ls||0)>=x.ls&&(r.rp||0)>=x.rp&&(r.rc||0)>=x.rc) t++; else break;} return t;};
const metTier=(r,f)=>TIERS.filter(x=>(r[f]||0)>=x[f]).length;
const plural=n=>n===1?'dzień':'dni';
function track(field,amt){const r=dayRec(); r[field]=(r[field]||0)+amt; checkDay(r);}
function checkDay(r){r=r||dayRec(); const t=tierOf(r), prev=r.tier||0;
  if(t>prev){r.tier=t; r.ok=1; const st=streak(); if(st.cur>S.best) S.best=st.cur;
    celebrate(t===1?'Dzień zaliczony: Easy!':`Poziom ${TIERS[t-1].n}!`, `Seria: ${st.cur} ${plural(st.cur)}. `+(t<3?`Możesz iść dalej, do progu ${TIERS[t].n}.`:'Dzisiaj wszystkie progi zdobyte.'));}
  const tk=dkey(today()); [['ls','recL','słuchania'],['rp','recR','powtórzeń'],['rc','recC','active recall']].forEach(([f,fl,nm])=>{if(r[fl]) return; const pv=Object.entries(S.day).filter(([k])=>k!==tk).reduce((m,[,x])=>Math.max(m,x[f]||0),0);
    if(pv>0&&(r[f]||0)>pv){r[fl]=1; toast(`Nowy rekord: ${nm}!`);}});
  checkBadges(); save(); header();}
function addNew(n){const r=dayRec(); r.nw=(r.nw||0)+n; checkBadges(); save(); header();}
function ensureStarted(u){if(S.u[u]) return false; S.u[u]=today(); addNew(unitInfo(u).n); toast('Paczka dodana do nauki'); return true;}
function streak(){const t=today(); let cur=0; let n=t; const met=k=>{const r=S.day[dkey(k)]; return !!(r&&(r.tier||r.ok));};
  const todayMet=met(t); if(!todayMet) n=t-1; while(met(n)){cur++; n--;} return {cur,todayMet};}

/* ---------- derived stats ---------- */
function unitInfo(u){const [a,b]=uRange(u); let sum=0,rated=0,five=0; for(let i=a;i<b;i++){const r=stars(i); sum+=r; if(r)rated++; if(r>=5)five++;}
  const n=b-a; const pct=sum/(5*n); const st=!started(u)?'new':(rated===n&&Array.from({length:n},(_,k)=>stars(a+k)).every(r=>r>=5)?'done':'learn'); return {n,pct,rated,five,st,a,b};}
function groupInfo(g){const [a,b]=gRange(g); let sum=0; for(let i=a;i<b;i++) sum+=stars(i); const us=gUnits(g); return {pct:sum/(5*(b-a)),startedN:us.filter(started).length,doneN:us.filter(u=>unitInfo(u).st==='done').length};}
function learningSet(){const out=[]; for(const u in S.u){const [a,b]=uRange(+u); for(let i=a;i<b;i++) out.push(i);} return out.sort((x,y)=>x-y);}
function dueList(){const t=today(); return learningSet().filter(i=>{const s=sst(i); return !s||!s.r||s.d<=t;}).sort((x,y)=>(stars(x)-stars(y))||(x-y));}
function nextUnit(){for(let u=0;u<NU;u++) if(!started(u)) return u; return -1;}

/* ---------- SRS ---------- */
function rate(i,r){const t=today(); const s=S.s[i]||{r:0,d:t,n:0,iv:0}; let iv;
  if(r===1) iv=0; else if(r===2) iv=1; else if(r===3) iv=2; else if(r===4) iv=Math.max(3,Math.round((s.r>=4?(s.iv||2):2)*1.6)); else iv=Math.max(6,Math.round((s.r>=4?(s.iv||3):2.4)*2.5));
  iv=Math.min(iv,90); S.s[i]={r,d:t+iv,n:(s.n||0)+1,iv}; const dr=dayRec(); dr.t=(dr.t||0)+1; track('rc',1);}

/* ---------- audio helpers ---------- */
const setPitch=el=>{try{el.preservesPitch=true;el.webkitPreservesPitch=true;el.mozPreservesPitch=true;}catch(e){}};
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),ms))]);
function wavBlob(data,sr){const hdr=new ArrayBuffer(44), dv=new DataView(hdr); const ws=(o,s)=>{for(let k=0;k<s.length;k++) dv.setUint8(o+k,s.charCodeAt(k));};
  ws(0,'RIFF'); dv.setUint32(4,36+data.byteLength,true); ws(8,'WAVE'); ws(12,'fmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true); dv.setUint32(24,sr,true); dv.setUint32(28,sr*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true); ws(36,'data'); dv.setUint32(40,data.byteLength,true);
  return new Blob([hdr,data.buffer],{type:'audio/wav'});}
function makeCtx(sr){const C=window.OfflineAudioContext||window.webkitOfflineAudioContext; return new C(1,sr,sr);}
async function decodeFile(f,sr){const buf=await (await fetch(f)).arrayBuffer(); let ctx; try{ctx=makeCtx(sr);}catch(e){ctx=makeCtx(22050);}
  return await new Promise((res,rej)=>{let ok=false; const r=x=>{if(!ok){ok=true;res(x);}}, j=e=>{if(!ok){ok=true;rej(e);}};
    try{const p=ctx.decodeAudioData(buf,r,j); if(p&&p.then) p.then(r,j);}catch(e){j(e);} setTimeout(()=>j(new Error('timeout')),30000);});}

/* ---------- foreground audio (each sentence = its own short clip with silence in front) ---------- */
const fg=$('#fg'); setPitch(fg);
let runId=0, wake=null;
function stopFg(){runId++; try{fg.pause();}catch(e){} releaseWake();}
const alive=id=>id===runId;
const sleep=(ms,id)=>new Promise(r=>{const t0=Date.now();(function f(){if(!alive(id)||Date.now()-t0>=ms) r(); else setTimeout(f,40);})();});
const SILENT=URL.createObjectURL(wavBlob(new Int16Array(1600),16000));
let fgUnlocked=false;
function unlockFg(){if(fgUnlocked) return; try{fg.src=SILENT; const p=fg.play(); if(p&&p.then) p.then(()=>{fgUnlocked=true;},()=>{});}catch(e){}}
const FSR=24000, PCM=new Map(), CLIPS=new Map();
function getPCM(f){if(PCM.has(f)){const v=PCM.get(f); PCM.delete(f); PCM.set(f,v); return v;}
  const p=decodeFile(f,FSR).then(ab=>({ch:ab.getChannelData(0),sr:ab.sampleRate})); p.catch(()=>{if(PCM.get(f)===p) PCM.delete(f);});
  PCM.set(f,p); while(PCM.size>3) PCM.delete(PCM.keys().next().value); return p;}
async function clip(i){if(CLIPS.has(i)){const v=CLIPS.get(i); CLIPS.delete(i); CLIPS.set(i,v); return v;}
  const a=AFILE[i]; const {ch,sr}=await getPCM(a.f); if(CLIPS.has(i)) return CLIPS.get(i);
  const s=Math.max(0,Math.floor(a.s*sr)), e=Math.min(ch.length,Math.ceil(a.e*sr)), n=e-s;
  const pre=Math.floor(sr*0.35), post=Math.floor(sr*0.15), fade=Math.floor(sr*0.012); const out=new Int16Array(pre+n+post);
  for(let k=0;k<n;k++){let v=ch[s+k]; if(k<fade) v*=k/fade; else if(k>n-fade) v*=(n-k)/fade; v=Math.max(-1,Math.min(1,v)); out[pre+k]=v<0?v*32768:v*32767;}
  const v={url:URL.createObjectURL(wavBlob(out,sr)),dur:out.length/sr}; CLIPS.set(i,v);
  while(CLIPS.size>60){const k=CLIPS.keys().next().value; URL.revokeObjectURL(CLIPS.get(k).url); CLIPS.delete(k);} return v;}
function prefetch(i){if(AFILE[i]) clip(i).catch(()=>{});}
async function playOne(i,id){const v=await playOne0(i,id); if(v>0){const r=dayRec(); r.ls=(r.ls||0)+v; track('rp',1);} return v;}
async function playOne0(i,id){const a=AFILE[i]; if(!a) return 0; pauseBg();
  let c=null; try{c=await withTimeout(clip(i),15000);}catch(e){c=null;}
  if(!alive(id)) return 0;
  if(!c) return playSeek(i,id);
  return await new Promise(res=>{let done=false, iv=0, to=0; const rate=S.set.rate;
    const fin=v=>{if(done) return; done=true; clearInterval(iv); clearTimeout(to); fg.removeEventListener('ended',onEnd); res(v);};
    const onEnd=()=>fin(c.dur/rate); fg.addEventListener('ended',onEnd);
    try{fg.pause();}catch(e){} fg.src=c.url; fg.defaultPlaybackRate=rate; fg.playbackRate=rate; setPitch(fg);
    try{const p=fg.play(); if(p&&p.catch) p.catch(()=>fin(0));}catch(e){fin(0);}
    // a newer tap only ends this wait; it never touches the player (stopFg already paused it)
    iv=setInterval(()=>{if(!alive(id)) fin(0); else if(!fg.paused&&fg.playbackRate!==S.set.rate) fg.playbackRate=S.set.rate;},60);
    to=setTimeout(()=>{if(alive(id)){try{fg.pause();}catch(e){}} fin(c.dur/rate);},(c.dur/rate+5)*1000);});}
// fallback when decoding is not possible: seek inside the long file, guarded by timeouts
function loadSrc(src){return new Promise(res=>{const full=new URL(src,location.href).href; if(fg.src===full&&fg.readyState>=1) return res();
  fg.src=src; const done=()=>{fg.removeEventListener('loadedmetadata',done);res();}; fg.addEventListener('loadedmetadata',done); fg.load(); setTimeout(res,8000);});}
async function playSeek(i,id){const a=AFILE[i]; await loadSrc(a.f); if(!alive(id)) return 0;
  fg.playbackRate=S.set.rate; try{fg.currentTime=Math.max(0,a.s-0.1);}catch(e){}
  try{await withTimeout(fg.play(),4000);}catch(e){return 0;}
  const t0=Date.now(), lim=((a.e-a.s)/S.set.rate+4)*1000;
  await new Promise(r=>{(function f(){if(!alive(id)) return r(); if(fg.currentTime>=a.e||fg.ended||Date.now()-t0>lim){fg.pause();return r();} setTimeout(f,25);})();});
  return (a.e-a.s)/S.set.rate;}
async function wakeLock(){try{if(navigator.wakeLock&&!wake) wake=await navigator.wakeLock.request('screen');}catch(e){wake=null;}}
function releaseWake(){try{wake&&wake.release();}catch(e){} wake=null;}

/* ---------- UI shell ---------- */
let V={tab:'learn',view:'home',g:0,u:0,mode:'read',open:{},cur:-1};
let T=null; // test session
function toast(t){const e=$('#toast'); e.textContent=t; e.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>e.hidden=true,2300);}
function celebrate(title,sub){const o=$('#overlay'); o.innerHTML=`<div class="celebrate" data-a="closeov"><div class="box"><svg viewBox="0 0 24 24" width="56" height="56" style="margin:0 auto"><path d="M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z" fill="var(--accent)"/></svg><h2>${esc(title)}</h2><p class="muted" style="margin:0">${esc(sub)}</p><button class="primary" data-a="closeov">Dalej</button></div></div>`;}
function header(){const st=streak(); const r=dayRec(); const tier=r.tier||0;
  $('#hstreak').className='streak'+(st.todayMet?'':' off');
  $('#hstreak').innerHTML=`<svg viewBox="0 0 24 24"><path d="M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z" fill="var(--accent)"/></svg>${st.cur}`;
  const ring=(R,f,col)=>{const v=r[f]||0, p=Math.min(1,v/TIERS[2][f]), C=2*Math.PI*R; const dot=fr=>{const a=2*Math.PI*fr; return `<circle cx="${18+R*Math.sin(a)}" cy="${18-R*Math.cos(a)}" r="0.9" fill="var(--fg)" opacity=".55"/>`;};
    return `<circle cx="18" cy="18" r="${R}" fill="none" stroke="var(--sunk)" stroke-width="3.2"/><circle cx="18" cy="18" r="${R}" fill="none" stroke="${p>=1?'var(--good)':col}" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 18 18)"/>${dot(.2)}${dot(.6)}`;};
  $('#hring').innerHTML=ring(15.6,'ls','var(--accent)')+ring(11.4,'rp','var(--fjord)')+ring(7.2,'rc','var(--rc)');
  $('#hxp').innerHTML=MET.map(([f,,fmt,un,,cl])=>{const v=r[f]||0, mt=metTier(r,f), nx=TIERS[Math.min(2,mt)][f]; return `<span class="${mt>=3?'okk':cl}">${fmt(v)}/${fmt(nx)} ${un}</span>`;}).join('');
  $('.hstats').setAttribute('aria-label',`Seria ${st.cur} ${plural(st.cur)}. Dziś: ${tier?TIERS[tier-1].n:'cel jeszcze niezaliczony'}. Otwórz statystyki.`);
  const due=dueList().length; const b=$('#tbadge'); b.hidden=!due; b.textContent=due>99?'99+':due;
  const full=T&&!T.inline; ['learn','test','listen'].forEach(t=>$('#tb-'+t).setAttribute('aria-current',V.tab===t&&V.view!=='stats'&&!full?'page':'false'));}
function go(o){stopFg(); Object.assign(V,o); if(T&&T.inline&&!(V.view==='unit'&&V.u===T.u)) T=null; render(); window.scrollTo(0,0);}
function starStr(r){r=Math.max(0,Math.min(5,r||0)); return `<span class="stars" aria-label="${r} z 5 gwiazdek">${STAR.repeat(r)}<span class="off">${STAR.repeat(5-r)}</span></span>`;}
const pct=x=>Math.round(x*100)+'%';
function render(){
  const app=$('#app');
  if(V.view==='stats') app.innerHTML=statsView();
  else if(T&&!T.inline) app.innerHTML=testView();
  else if(V.tab==='learn') app.innerHTML=V.view==='group'?groupView():V.view==='unit'?unitView():learnHome();
  else if(V.tab==='test') app.innerHTML=V.view==='weak'?weakView():testHome();
  else app.innerHTML=listenView();
  header();
}

/* ---------- NAUKA ---------- */
function learnHome(){
  const nu=nextUnit(); const r=dayRec(); const ls=learningSet();
  let h=`<div class="stack">`;
  if(nu>=0){const [a,b]=uRange(nu); h+=`<div class="hero"><div class="between"><div><div class="eyebrow">Następna paczka</div><h2>Zdania ${a+1}–${b}</h2></div><span class="chipst">${r.nw||0} nowych dziś</span></div>
    <div class="muted small">${esc(D[a][0])}, ${esc(D[a+1][0])}, ${esc(D[a+2][0])}…</div><button class="primary" data-a="openunit" data-u="${nu}">Ucz się tej paczki</button></div>`;}
  else h+=`<div class="hero"><h2>Wszystkie paczki są w nauce</h2><p class="muted" style="margin:0">Teraz powtórki i słuchanie, aż wszystko będzie na 5 gwiazdek.</p></div>`;
  h+=`<div class="between"><h2>Setki</h2><span class="muted small">${ls.length} zdań w nauce</span></div><div class="glist">`;
  for(let g=0;g<NG;g++){const [a,b]=gRange(g); const gi=groupInfo(g);
    const cells=gUnits(g).map(u=>{const ui=unitInfo(u); const lv=!started(u)?'':ui.pct>=.9?'l4':ui.pct>=.6?'l3':ui.pct>=.3?'l2':'l1'; return `<i class="${lv} ${started(u)&&ui.pct<.3?'st':''}"></i>`;}).join('');
    h+=`<button class="gcard" data-a="opengroup" data-g="${g}"><div class="num">${a+1}<small>–${b}</small></div><div style="min-width:0"><div class="between"><b class="small">${g>=10?'czasowniki + rzeczowniki':'czasowniki'}</b><span class="pct">${pct(gi.pct)}</span></div><div class="cells">${cells}</div><div class="muted small" style="margin-top:4px">${gi.startedN}/10 paczek w nauce · ${gi.doneN} opanowane</div></div><span class="muted">›</span></button>`;}
  return h+`</div></div>`;
}
function groupView(){const g=V.g,[a,b]=gRange(g),gi=groupInfo(g);
  let h=`<div class="stack"><button class="ghost back" data-a="home">‹ Setki</button><div class="between"><div><div class="eyebrow">Setka ${g+1} z ${NG}</div><h1>Zdania ${a+1}–${b}</h1></div><span class="pct" style="font-size:1.2rem">${pct(gi.pct)}</span></div><div class="bar"><i style="width:${gi.pct*100}%"></i></div><div class="stack" style="gap:8px">`;
  gUnits(g).forEach((u,k)=>{const ui=unitInfo(u); const lab={new:'nowa',learn:'w nauce',done:'opanowana'}[ui.st];
    const avg=ui.rated?Math.round(ui.pct*5):0;
    h+=`<button class="ucard" data-a="openunit" data-u="${u}"><div style="min-width:0"><div class="between"><b>Paczka ${k+1} · ${ui.a+1}–${ui.b}</b></div><div class="muted small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(D[ui.a][0])}, ${esc(D[ui.a+1][0])}, ${esc(D[ui.a+2][0])}…</div>${started(u)?`<div class="row" style="gap:10px;margin-top:4px">${starStr(avg)}<span class="pct muted">${pct(ui.pct)}</span></div>`:''}</div><span class="chipst ${ui.st}">${lab}</span></button>`;});

  say:()=>{stopFg(); const id=runId; playOne(T.q[T.k],id);},
  twords:()=>{T.words=!T.words; render();},
  rate:d=>{const r=+d.r, i=T.q[T.k]; rate(i,r); T.got.push(r); if(r===1&&!T.requeued[i]){T.requeued[i]=1; T.q.push(i);} T.k++; T.show=false; T.words=false; stopFg(); render(); window.scrollTo(0,0); prefetch(T.q[T.k]); prefetch(T.q[T.k+1]);},
  testagain:()=>{const w=[...new Set(T.q.filter(i=>stars(i)<=3))]; if(!w.length){toast('Nie masz słabych zdań w tej rundzie'); return;} const b=T.back; startTest(shuffle(w),'Słabe jeszcze raz',b,T.inline?{inline:true,u:T.u}:null);},
  testend:()=>{const inl=T&&T.inline; const b=T&&T.back; T=null; stopFg(); if(inl){render(); window.scrollTo(0,0); return;} if(b){V.tab=b.tab; V.view=b.view;} go({});},
  lpool:d=>{S.set.lpool=d.v; save(); render();}, lmin:d=>{S.set.lmin=+d.v; save(); render();}, lrep:d=>{S.set.lrep=+d.v; save(); render();},
  buildmix:()=>buildMix(),
  bgtoggle:()=>{if(!MIX) return; if(bg.paused){stopFg(); bg.play().catch(()=>{});} else bg.pause();},
  bgstop:()=>{bg.pause(); if(MIX&&MIX.url) URL.revokeObjectURL(MIX.url); MIX=null; bg.removeAttribute('src'); save(); render();},
  chkupd:async()=>{toast('Sprawdzam…'); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    try{const r=await navigator.serviceWorker.getRegistration(); if(r){await r.update(); const w=r.installing||r.waiting; if(w){toast('Pobieram nową wersję…'); await new Promise(res=>{if(w.state==='activated') return res(); w.addEventListener('statechange',()=>{if(w.state==='activated'||w.state==='redundant') res();}); setTimeout(res,20000);});}}}catch(e){}
    try{const v=await (await fetch('index.html',{cache:'no-store'})).text(); const m=v.match(/APPVER='(\d+)'/); if(m&&m[1]===APPVER){toast('Masz najnowszą wersję'); return;}}catch(e){toast('Brak internetu'); return;}
    location.reload();},
  hs:d=>{V.hs=V.hs===d.f?null:d.f; render();},
  export:()=>{const txt=JSON.stringify(S); const box=$('#bk'); box.innerHTML=`<textarea id="bktxt" readonly>${esc(txt)}</textarea><span class="muted small">Skopiowane. Wklej to w mailu albo notatce.</span>`;
    const ta=$('#bktxt'); try{navigator.clipboard.writeText(txt).then(()=>toast('Kopia skopiowana'),()=>{ta.select();toast('Zaznacz i skopiuj tekst');});}catch(e){ta.select();}},
  importshow:()=>{$('#bk').innerHTML=`<textarea id="imtxt" placeholder="Wklej tu skopiowaną kopię"></textarea><button class="primary" data-a="import">Wczytaj i zastąp obecny postęp</button>`;},
  import:()=>{const x=parseBackup($('#imtxt').value); if(!x){toast('To nie wygląda na kopię z aplikacji Norsk'); return;} applyBackup(x);},
  backup:()=>{const txt=JSON.stringify(S); const name=`norsk-kopia-${dkey(today())}.json`; const ok=()=>{S.lastBk=today(); save(); toast('Kopia zapisana'); if(V.view==='stats') render();};
    let file=null; try{file=new File([txt],name,{type:'application/json'});}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Norsk – kopia postępu'}).then(ok,e=>{if(!e||e.name!=='AbortError'){toast('Nie udało się, kopiuję jako tekst'); A.export();}}); return;}
    try{const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},4000); ok();}catch(e){A.export();}},
  importfile:()=>{const f=$('#imfile'); if(f){f.value=''; f.click();}},
  importok:()=>{if(PEND) applyBackup(PEND); PEND=null;},
  mnedit:d=>{const i=+d.i, w=(W[i]||[])[+d.k]; if(!w) return; const [f,b,g]=w; const [k,t]=mnGet(b,f);
    $('#overlay').innerHTML=`<div class="modal"><div class="sheet stack"><div class="eyebrow">Twoje skojarzenie</div><h2>${esc(b)}${lc(f)!==lc(b)?` <span class="muted small">(${esc(f)})</span>`:''}</h2><div class="muted small">${esc(g||'')}</div>
      <textarea id="mntxt" placeholder="np. trenge → trening: żeby coś umieć, potrzebujesz treningu">${esc(t)}</textarea>
      <div class="row"><button class="primary" data-a="mnsave" data-key="${esc(k)}" data-i="${i}" style="flex:1">Zapisz</button>${t?`<button data-a="mndel" data-key="${esc(k)}" data-i="${i}">Usuń</button>`:''}<button class="ghost" data-a="closeov">Anuluj</button></div></div></div>`;
    const ta=$('#mntxt'); try{ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);}catch(e){}},
  mnsave:d=>{const t=$('#mntxt').value.trim(); if(t) S.m[d.key]=t; else delete S.m[d.key]; save(); $('#overlay').innerHTML=''; refreshSent(+d.i); toast(t?'Skojarzenie zapisane':'Skojarzenie usunięte');},
  mndel:d=>{delete S.m[d.key]; save(); $('#overlay').innerHTML=''; refreshSent(+d.i); toast('Skojarzenie usunięte');},
  lmode:d=>{S.set.lmode=d.v; save(); render();},
  lspeed:d=>{S.set.lspeed=+d.v; save(); try{bg.defaultPlaybackRate=S.set.lspeed; bg.playbackRate=S.set.lspeed; setPitch(bg);}catch(e){} render();},
};
let PEND=null;
function refreshSent(i){if(T){render(); return;} const el=document.getElementById('s'+i); if(el) el.outerHTML=sentenceItem(i);}
function parseBackup(txt){try{const x=JSON.parse(txt); if(!x||x.v!==2||typeof x.s!=='object') return null; return x;}catch(e){return null;}}
function applyBackup(x){S=Object.assign(JSON.parse(JSON.stringify(DEF)),x); normState(); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} toast('Postęp wczytany'); render();}
document.addEventListener('change',e=>{if(e.target.id!=='imfile') return; const f=e.target.files&&e.target.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{const x=parseBackup(rd.result); const box=$('#bk'); if(!x){toast('Ten plik to nie jest kopia z aplikacji Norsk'); return;} PEND=x;
    const rated=Object.values(x.s).filter(v=>v&&v.r).length, units=Object.keys(x.u||{}).length, days=Object.keys(x.day||{}).sort();
    if(box) box.innerHTML=`<div class="hero"><b>${esc(f.name)}</b><span class="muted small">${units} paczek w nauce · ${rated} ocenionych zdań · ${Object.keys(x.m||{}).length} skojarzeń${days.length?` · ostatni dzień nauki ${days[days.length-1]}`:''}</span><button class="primary" data-a="importok">Zastąp obecny postęp tą kopią</button></div>`;};
  rd.readAsText(f);});
function shuffle(a){a=a.slice(); for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1)); [a[k],a[j]]=[a[j],a[k]];} return a;}
const AUDIO_ACTS={play:1,playall:1,rep:1,reveal:1,say:1};
document.addEventListener('click',e=>{if(e.target.classList&&e.target.classList.contains('modal')){$('#overlay').innerHTML=''; return;} const b=e.target.closest('[data-a]'); if(!b) return; if(AUDIO_ACTS[b.dataset.a]) unlockFg(); if(b.dataset.a==='closeov'&&e.target.closest('.box')&&e.target.tagName!=='BUTTON') return; const f=A[b.dataset.a]; if(f){e.preventDefault(); f(b.dataset,b);}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){header(); if(V.tab==='listen'&&!T) render();} else {try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}});
if('serviceWorker' in navigator && location.protocol!=='file:'){const had=!!navigator.serviceWorker.controller; let reloaded=false;
  navigator.serviceWorker.register('sw.js').then(r=>{try{r.update();}catch(e){}}).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||reloaded) return; try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    if(MIX&&!bg.paused){toast('Jest nowa wersja. Otwórz aplikację ponownie, kiedy skończysz słuchać.'); return;} reloaded=true; location.reload();});}
render();
})();
</script>
</body>
